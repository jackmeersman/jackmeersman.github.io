<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found — Jack Meersman</title>
  <meta name="robots" content="noindex">
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t)}}catch(e){}})();</script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="frame not-found" id="main">
    <p class="eyebrow">404 · Page not found</p>
    <h1>There’s nothing at this address.</h1>
    <p class="lead">The page may have moved when the site was rebuilt. Everything lives on the home page now.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go to Home Page</a>
    </div>
  </main>
</body>
</html>
